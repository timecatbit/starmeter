name: macOS standalone

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      expected-tag:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            artifact: AppleSilicon-arm64
          - runner: macos-26-intel
            artifact: Intel-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The app carries its compiled engine for the runner's chip; no Python goes into the image.
      - name: Build, validate and smoke test the disk image
        env:
          EXPECTED_TAG: ${{ inputs.expected-tag }}
        run: python3 scripts/build_dmg.py --tag "$EXPECTED_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: token-monitor-macos-${{ matrix.artifact }}
          path: dist/*.dmg
          if-no-files-found: error
