name: Windows tray

# Releases need this build, and main takes direct pushes, so it runs on every push that can break it
# rather than first surfacing at a tag.
on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "engine/**"
      - "lib/**"
      - "assets/**"
      - "starmeter.30s.sh"
      - "tests/test_windows.py"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "engine/**"
      - "lib/**"
      - "assets/**"
      - "starmeter.30s.sh"
      - "tests/test_windows.py"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      expected-tag:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tray:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      # Offscreen Qt reads fonts from this folder instead of asking Windows.
      QT_QPA_FONTDIR: C:\Windows\Fonts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      # The tray's data engine is the same Swift program as on the Mac.
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.1.2-release
          tag: 6.1.2-RELEASE
      - name: Build the Swift engine and its probe
        run: swift build -c release --package-path engine --scratch-path build/engine-release
      - name: Run the engine on Windows
        run: |
          $engine = "build/engine-release/release/starmeter-engine.exe"
          $version = & $engine --desktop version
          Write-Output $version
          if ($version -notmatch '"result"') { throw "The engine gave no answer." }
      - name: Install build dependencies
        run: python -m pip install -r windows/requirements.txt pyinstaller==6.16.0
      - name: Verify Windows adapters and panel
        run: python -m unittest discover -s tests -p test_windows.py -v
      - name: Build and smoke test the standalone exe
        env:
          EXPECTED_TAG: ${{ inputs.expected-tag }}
        run: ./windows/build.ps1 -ExpectedTag $env:EXPECTED_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: token-monitor-windows-x64
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64-setup.exe
          if-no-files-found: error
      # Also on failure: the install and uninstall logs say where a run stopped.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: token-monitor-windows-smoke
          path: |
            build/windows/smoke.png
            build/windows/setup.log
            build/windows/uninstall.log
          if-no-files-found: warn
