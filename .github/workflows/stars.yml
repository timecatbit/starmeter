# Draws the READMEs' star chart (scripts/star_chart.py) once a day from the GitHub API and keeps the two pictures on
# their own branch, stars, as a single commit: the READMEs show them from there, so the chart never waits on another
# site, and main's history stays free of daily commits.
name: Star chart

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/star_chart.py, .github/workflows/stars.yml]

permissions:
  contents: write

concurrency:
  group: star-chart
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Draw
        run: python3 scripts/star_chart.py "$GITHUB_REPOSITORY" .stars
      - name: Publish on the stars branch
        working-directory: .stars
        run: |
          git init -q -b stars
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stars.svg stars-dark.svg
          git commit -q -m 'Star chart'
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stars
