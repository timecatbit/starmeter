# A release is published only after the SwiftBar plugin ZIP, both Mac disk images and the Windows installer are
# built and pass their checks. Run by hand (workflow_dispatch) to build everything without publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plugin:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run checks
        run: python3 scripts/check.py
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 scripts/package.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/package.py
          fi
      - name: Install the package into an empty plugin folder
        run: |
          scratch="$RUNNER_TEMP/install-test"
          mkdir -p "$scratch/home" "$scratch/plugins" "$scratch/unpacked"
          ditto -x -k dist/starmeter-*.zip "$scratch/unpacked"
          # No source checkout, no compiler: the installer works from the unpacked zip alone, with the macOS
          # Python an installed 5.x plugin runs it with.
          HOME="$scratch/home" /usr/bin/python3 "$scratch"/unpacked/starmeter-*/install.py --plugin-dir "$scratch/plugins" --no-refresh
          [ "$(ls "$scratch/plugins")" = starmeter.30s.sh ]
          test -x "$scratch/plugins/starmeter.30s.sh"
          codesign --verify --deep --strict "$scratch/plugins/.opencodex-panel/OpenCodexPanel.app"
          codesign --verify --strict "$scratch/plugins/.opencodex-panel/bin/starmeter-engine"
          # The installed plugin answers SwiftBar from the engine alone.
          HOME="$scratch/home" OCX_SELF_UPDATES=0 OCX_PRICING_UPDATES=0 /bin/bash -p "$scratch/plugins/starmeter.30s.sh" | grep -q '关于 Starmeter'
          if matches=$(grep -rlF -e "$GITHUB_WORKSPACE" -e "$scratch/unpacked" "$scratch/plugins"); then
            echo 'The installed plugin refers to the package or source folder:'
            for file in $matches; do echo "$file"; grep -aoF -e "$GITHUB_WORKSPACE" -e "$scratch/unpacked" "$file" | sort -u | head -3; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: starmeter-plugin
          path: dist/
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            artifact: AppleSilicon-arm64
          - runner: macos-26-intel
            artifact: Intel-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Each runner builds the app and engine for its own chip, then mounts the image and runs the engine inside.
      - name: Build, check and smoke-test the disk image
        run: python3 scripts/build_dmg.py --tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: starmeter-macos-${{ matrix.artifact }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Inno Setup comes with the runner image; the script finds it and builds the per-user installer.
      - name: Build, smoke-test, install and uninstall
        run: python scripts/build_windows.py --tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: starmeter-windows-x64
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64-setup.exe
          if-no-files-found: error

  # The Linux tray, as an AppImage and a .deb (tried on an XFCE desktop before its first release, 6.0.5).
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build and smoke-test the AppImage and .deb
        run: python3 scripts/build_linux.py --tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: starmeter-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [plugin, macos, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: starmeter-plugin
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: starmeter-windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: starmeter-linux-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: starmeter-macos-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # scripts/package.py lists the downloads as file#label: GitHub shows the label in place of the file name
          # and its own SHA-256 beside each file, so no checksum files are uploaded.
          assets=()
          while IFS= read -r asset; do
            test -f "dist/${asset%%#*}"
            assets+=("dist/$asset")
          done < dist/release-assets.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Starmeter ${GITHUB_REF_NAME#v}" \
            --notes-file dist/release-notes.md "${assets[@]}"
