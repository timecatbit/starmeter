<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Starmeter</title>
    <!-- On a phone, the colours of the last load before the first frame (src/lib/edges.ts). -->
    <script src="/first-frame.js"></script>
    <!-- The page's first rules, in a file rather than in a <style> here (or a style attribute): Tauri puts a nonce on
         every inline <style> and into style-src, which turns 'unsafe-inline' off, and then each style attribute is
         refused. The hand's filter below lost its position: absolute that way and stood in the flow as a line, 16 points
         over the panel, which showed a gap under the menu bar and its foot cut off. first-frame.css says why each rule. -->
    <link rel="stylesheet" href="/first-frame.css" />
  </head>
  <body>
    <!-- 手绘 (sketch.css): the hand's unsteady line, for the lines that look draws; never the words. -->
    <svg class="filters" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="hand" x="-4%" y="-8%" width="108%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="app"></div>
    <div class="bar-tint top" aria-hidden="true"></div>
    <div class="bar-tint bottom" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
